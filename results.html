<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Student Result Page</title>
        <link rel="stylesheet" href="stylesheet.css">
</head>
<body>
        <header>     
              <style>
                  body {
                      font-family: cursive;
                      background: #f4f4f4;
                      margin: 0;
                      padding: 20px;
                  }
          
                  .result-container {
                      max-width: 600px;
                      margin: auto;
                      background: linear-gradient(to 270 degs, #DF86FF, #722CFF) ;
                      padding: 20px;
                      border-radius: 12px;
                      box-shadow: 0 0 15px rgba(0,0,0,0.1);
                  }
          
                  .student-photo {
                      width: 120px;
                      height: 120px;
                      border-radius: 10px;
                      object-fit: cover;
                      border: 3px solid #722CFF;
                  }
          
                  .header {
                      text-align: center;
                  }
          
                  .header h2 {
                      margin-bottom: 5px;
                  }
          
                  .info-section {
                      margin-top: 20px;
                  }
          
                  .info-section h3 {
                      margin-bottom: 10px;
                      border-bottom: 2px solid #007bff;
                      padding-bottom: 5px;
                  }
          
                  .details p, .scores p {
                      margin: 5px 0;
                      font-size: 16px;
                  }
          
                  .score-box {
                      background: #eef7ff;
                      padding: 10px;
                      border-radius: 8px;
                  }
          
                  .final-result {
                      margin-top: 20px;
                      padding: 15px;
                      background: #d4edda;
                      color:  #DF86FF, #722CFF;
                      border: 1px solid #722CFF;
                      border-radius: 8px;
                      font-size: 18px;
                      text-align: center;
                      font-weight: bold;
                  }
              </style>
          </head>
          
          <body>
          
          <div class="result-container">
          
              <div class="header">
                  <img src="/assets/Images/ps pi03.png" alt="Student Photo" class="student-photo">
                  <h2>Student Result Slip</h2>
                  <p>Academic Session: 2025</p>
              </div>
          
              <div class="info-section">
                  <h3>Student Details</h3>
                  <div class="details">
                      <p><strong>Name:</strong> John Doe</p>
                      <p><strong>Class:</strong> SS2</p>
                      <p><strong>Gender:</strong> Male</p>
                      <p><strong>Admission Number:</strong> 2025/1043</p>
                  </div>
              </div>
          
              <div class="info-section">
                  <h3>Scores</h3>
                  <div class="score-box scores">
                      <p><strong>Mathematics:</strong> 85</p>
                      <p><strong>English:</strong> 78</p>
                      <p><strong>Biology:</strong> 90</p>
                      <p><strong>Chemistry:</strong> 82</p>
                      <p><strong>Physics:</strong> 88</p>
                  </div>
              </div>
          
              <div class="final-result">
                  Overall Result: PASSED
              </div>
          
          </div>

                <a href="index.html" id="cta">RETURN TO HOME PAGE</a>
        </header>
</body>
</html>
